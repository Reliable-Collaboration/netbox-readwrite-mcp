[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-agent-api"
version = "0.3.0"
description = "Native metadata, configuration and dashboard APIs for NetBox Community agents"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_agent_api*"]
