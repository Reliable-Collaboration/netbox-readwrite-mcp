name: Audit contracts
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,dev]'
      - run: ruff check src tests scripts companion && ruff format --check src tests scripts companion
      - run: pytest --cov=netbox_readwrite_mcp --cov-fail-under=85 --junitxml=unit-results.xml
      - run: python -m build && python -m build companion
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-${{ matrix.python }}
          path: unit-results.xml
  netbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        netbox: ['4.7.2']
    env:
      NETBOX_RW_TEST_VERSION: ${{ matrix.netbox }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: python -m pip install -e '.[test]'
      - run: python scripts/lab.py up
      - run: python scripts/lab.py ready
      - run: python scripts/lab.py bootstrap && python scripts/seed.py
      - run: NETBOX_RW_LIVE=1 pytest tests/unit tests/integration --cov=netbox_readwrite_mcp --cov-fail-under=85 -v --junitxml=.lab/${{ matrix.netbox }}/integration-results.xml
      - name: Verify installed companion image
        run: |
          python -m pip install build
          python -m build companion
          podman build -f packaging/Containerfile.netbox -t localhost/netbox-agent-api:qualification .
          podman run --rm --network nbrw-audit-4-7-2 --env-file .lab/4.7.2/netbox.env --entrypoint /opt/netbox/venv/bin/python localhost/netbox-agent-api:qualification /opt/netbox/netbox/manage.py shell -c 'from django.conf import settings; from django.urls import resolve; from importlib.metadata import version; assert "netbox_agent_api" in settings.PLUGINS; assert version("netbox-agent-api") == "0.4.0"; resolve("/api/plugins/agent-support/"); print("Installed companion and automatic enablement: PASS")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-${{ matrix.netbox }}
          path: .lab/${{ matrix.netbox }}/integration-results.xml
          include-hidden-files: true
      - if: always()
        run: python scripts/lab.py stop
