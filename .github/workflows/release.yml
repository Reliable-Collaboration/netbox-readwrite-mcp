name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PY
      - run: python -m pip install build && python -m build && python -m build companion
      - run: python scripts/release_assets.py
      - name: Verify standalone entry point
        run: |
          python release/netbox-readwrite-mcp.pyz --help
          python - <<'PY'
          import sys
          sys.path.insert(0, 'release/netbox-readwrite-mcp.pyz')
          from netbox_readwrite_mcp.guidance import guidance
          assert 'operation' in guidance()['instructions']
          PY
      - name: Build companion image
        run: docker build -f packaging/Containerfile.netbox -t ghcr.io/reliable-collaboration/netbox-agent-api:${GITHUB_REF_NAME#v}-netbox4.7.2 .
      - name: Publish companion image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/reliable-collaboration/netbox-agent-api:${GITHUB_REF_NAME#v}-netbox4.7.2
      - name: Publish downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "NetBox agent tools ${GITHUB_REF_NAME}" --notes-file packaging/release-notes.md
